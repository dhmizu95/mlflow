services:
  db:
    image: postgres:16-alpine
    container_name: mlflow_db
    environment:
      POSTGRES_USER: mlflow
      POSTGRES_PASSWORD: mlflow_db_password
      POSTGRES_DB: mlflow_metadata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mlflow -d mlflow_metadata"]
      interval: 5s
      timeout: 5s
      retries: 5

  # RustFS high-performance object storage acting as your S3 backend
  rustfs:
    image: minio/minio:latest # RustFS implements the exact S3 API
    container_name: rustfs_storage
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${RUSTFS_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${RUSTFS_SECRET_KEY}
    volumes:
      - rustfs_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"

  # Automate the creation of the target MLflow bucket inside RustFS
  rustfs-init:
    image: minio/mc
    depends_on:
      - rustfs
    entrypoint: >
      /bin/sh -c "
      until (/usr/bin/mc alias set myrustfs http://rustfs:9000 ${RUSTFS_ACCESS_KEY} ${RUSTFS_SECRET_KEY}) do echo 'Waiting for RustFS...' && sleep 1; done;
      /usr/bin/mc mb --ignore-existing myrustfs/${RUSTFS_BUCKET};
      exit 0;
      "

  mlflow-server:
    build: .
    container_name: mlflow_tracking
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
      rustfs:
        condition: service_started
    environment:
      # S3 Credentials mapping to RustFS
      AWS_ACCESS_KEY_ID: ${RUSTFS_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${RUSTFS_SECRET_KEY}
      MLFLOW_S3_ENDPOINT_URL: http://rustfs:9000
      
      # MLflow Built-in Authentication Flags
      MLFLOW_FLASK_SERVER_SECRET_KEY: ${FLASK_SECRET_KEY}
      MLFLOW_AUTH_ADMIN_USERNAME: ${ADMIN_USERNAME}
      MLFLOW_AUTH_ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri postgresql://mlflow:mlflow_db_password@db:5432/mlflow_metadata
      --default-artifact-root s3://${RUSTFS_BUCKET}/
      --app-name basic-auth

volumes:
  postgres_data:
  rustfs_data:
