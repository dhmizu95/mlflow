services:
  db:
    image: postgres:16-alpine
    container_name: mlflow_db
    environment:
      POSTGRES_USER: mlflow
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: mlflow_metadata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mlflow -d mlflow_metadata"]
      interval: 5s
      timeout: 5s
      retries: 5

  # RustFS high-performance distributed object storage (S3-compatible)
  rustfs:
    image: rustfs/rustfs:1.0.1
    container_name: rustfs_storage
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY}
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
    volumes:
      - rustfs_data:/data
    ports:
      - "127.0.0.1:19000:9000"
      - "127.0.0.1:19001:9001"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:9000/health"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  # Automate bucket provisioning using native RustFS CLI client (rc)
  rustfs-init:
    image: rustfs/rc:v0.1.36
    container_name: rustfs_init
    depends_on:
      rustfs:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      until (/usr/bin/rc alias set myrustfs http://rustfs:9000 ${RUSTFS_ACCESS_KEY} ${RUSTFS_SECRET_KEY}) do echo 'Waiting for RustFS...' && sleep 1; done;
      /usr/bin/rc mb --ignore-existing myrustfs/${RUSTFS_BUCKET} || /usr/bin/rc mb myrustfs/${RUSTFS_BUCKET} || true;
      exit 0;
      "

  mlflow-server:
    build: .
    container_name: mlflow_tracking
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
      rustfs:
        condition: service_healthy
      rustfs-init:
        condition: service_completed_successfully
    environment:
      # S3 Credentials mapping to RustFS
      AWS_ACCESS_KEY_ID: ${RUSTFS_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${RUSTFS_SECRET_KEY}
      MLFLOW_S3_ENDPOINT_URL: http://rustfs:9000
      
      # MLflow Built-in Authentication Flags
      MLFLOW_FLASK_SERVER_SECRET_KEY: ${FLASK_SECRET_KEY}
      MLFLOW_AUTH_CONFIG_PATH: /tmp/basic_auth.ini
      DB_PASSWORD: ${DB_PASSWORD}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      RUSTFS_BUCKET: ${RUSTFS_BUCKET}
    # basic_auth.ini ignores env vars, so generate it at startup (auth tables live in Postgres, not SQLite)
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        printf '[mlflow]\ndefault_permission = NO_PERMISSIONS\ndatabase_uri = postgresql://mlflow:%s@db:5432/mlflow_metadata\nadmin_username = %s\nadmin_password = %s\nauthorization_function = mlflow.server.auth:authenticate_request_basic_auth\n' "$$DB_PASSWORD" "$$ADMIN_USERNAME" "$$ADMIN_PASSWORD" > /tmp/basic_auth.ini
        exec mlflow server --host 0.0.0.0 --port 5000 \
          --backend-store-uri "postgresql://mlflow:$$DB_PASSWORD@db:5432/mlflow_metadata" \
          --artifacts-destination "s3://$$RUSTFS_BUCKET/" \
          --serve-artifacts --app-name basic-auth

volumes:
  postgres_data:
  rustfs_data:
