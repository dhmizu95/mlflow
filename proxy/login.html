<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign in · MLflow</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='58 14 18 18'%3E%3Cpath d='M71.8 16.5c-3.2-2.3-7.6-1.8-10.3 1-2.7 2.9-2.9 7.3-.5 10.4l2.4-1.8c-1.2-1.5-1.4-3.5-.6-5.3.8-1.7 2.6-2.8 4.5-2.9v1.9z' fill='%2343C9ED'/%3E%3Cpath d='M62.6 29.5c3.2 2.3 7.6 1.8 10.3-1 2.7-2.9 2.9-7.3.5-10.4L71 19.8c1.2 1.5 1.4 3.5.6 5.3-.8 1.7-2.6 2.8-4.5 2.9V26z' fill='%230194E2'/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #f4f7fb;
    --bg-accent: rgba(1, 148, 226, .10);
    --card: #ffffff;
    --border: #dfe5ec;
    --text: #11171c;
    --muted: #5f7281;
    --input-bg: #ffffff;
    --primary: #0194e2;
    --primary-hover: #0177b5;
    --focus: rgba(1, 148, 226, .28);
    --danger: #c82d4c;
    --danger-bg: #fdf1f3;
    --shadow: 0 1px 2px rgba(17, 23, 28, .04), 0 12px 32px rgba(17, 23, 28, .08);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #11171c;
      --bg-accent: rgba(67, 201, 237, .10);
      --card: #1a2229;
      --border: #2c3a45;
      --text: #e8ecf0;
      --muted: #92a4b3;
      --input-bg: #11171c;
      --primary: #2ea6ec;
      --primary-hover: #57b8f1;
      --focus: rgba(67, 201, 237, .30);
      --danger: #f2788f;
      --danger-bg: rgba(242, 120, 143, .10);
      --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 16px 40px rgba(0, 0, 0, .35);
    }
  }
  :root[data-theme="dark"] {
    --bg: #11171c; --bg-accent: rgba(67, 201, 237, .10); --card: #1a2229; --border: #2c3a45;
    --text: #e8ecf0; --muted: #92a4b3; --input-bg: #11171c; --primary: #2ea6ec; --primary-hover: #57b8f1;
    --focus: rgba(67, 201, 237, .30); --danger: #f2788f; --danger-bg: rgba(242, 120, 143, .10);
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 16px 40px rgba(0, 0, 0, .35);
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    color: var(--text);
    background:
      radial-gradient(900px 500px at 15% -10%, var(--bg-accent), transparent 60%),
      radial-gradient(700px 450px at 110% 110%, var(--bg-accent), transparent 60%),
      var(--bg);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
  }

  main { width: 100%; max-width: 400px; }

  .logo { display: flex; justify-content: center; margin-bottom: 28px; color: var(--text); }
  .logo svg { height: 44px; width: auto; }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    box-shadow: var(--shadow);
    padding: 32px;
  }
  h1 { margin: 0; font-size: 20px; font-weight: 600; letter-spacing: -.01em; }
  .sub { margin: 4px 0 24px; color: var(--muted); }

  .field { margin-bottom: 16px; }
  label { display: block; font-weight: 600; margin-bottom: 6px; }
  .control { position: relative; }
  input {
    width: 100%;
    height: 40px;
    padding: 0 12px;
    font: inherit;
    color: var(--text);
    background: var(--input-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    transition: border-color .15s, box-shadow .15s;
  }
  input:hover { border-color: var(--muted); }
  input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px var(--focus); }
  input[aria-invalid="true"] { border-color: var(--danger); }
  #p { padding-right: 44px; }

  .toggle {
    position: absolute; top: 4px; right: 4px;
    width: 32px; height: 32px;
    display: grid; place-items: center;
    background: none; border: 0; border-radius: 6px;
    color: var(--muted); cursor: pointer;
  }
  .toggle:hover { color: var(--text); }
  .toggle:focus-visible { outline: none; box-shadow: 0 0 0 3px var(--focus); }
  .toggle svg { width: 18px; height: 18px; }
  .toggle .hide, .toggle[aria-pressed="true"] .show { display: none; }
  .toggle[aria-pressed="true"] .hide { display: block; }

  .alert {
    display: none;
    gap: 8px; align-items: flex-start;
    margin-bottom: 16px; padding: 10px 12px;
    color: var(--danger); background: var(--danger-bg);
    border: 1px solid color-mix(in srgb, var(--danger) 35%, transparent);
    border-radius: 8px;
  }
  .alert.on { display: flex; }
  .alert svg { flex: none; width: 16px; height: 16px; margin-top: 2px; }

  .submit {
    width: 100%; height: 40px; margin-top: 8px;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    font: inherit; font-weight: 600; color: #fff;
    background: var(--primary); border: 0; border-radius: 8px; cursor: pointer;
    transition: background .15s;
  }
  .submit:hover { background: var(--primary-hover); }
  .submit:focus-visible { outline: none; box-shadow: 0 0 0 3px var(--focus); }
  .submit:disabled { opacity: .75; cursor: progress; }
  .spinner {
    display: none; width: 16px; height: 16px;
    border: 2px solid rgba(255, 255, 255, .45); border-top-color: #fff; border-radius: 50%;
    animation: spin .7s linear infinite;
  }
  .submit:disabled .spinner { display: block; }
  @keyframes spin { to { transform: rotate(360deg); } }

  footer { margin-top: 24px; text-align: center; color: var(--muted); font-size: 13px; }
  footer a { color: inherit; }
  footer a:hover { color: var(--primary); }

  @media (max-width: 440px) { .card { padding: 24px 20px; } }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation-duration: 1.5s !important; } }
</style>
</head>
<body>
<main>
  <div class="logo">
    <!-- MLflow wordmark, taken from the MLflow UI bundle -->
    <svg viewBox="0 0 109 40" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="MLflow">
      <path d="M0 31.0316V15.5024H3.54258V17.4699C4.43636 15.8756 6.38278 15.045 8.13589 15.045C10.178 15.045 11.9636 15.9713 12.7943 17.7895C14.0096 15.7474 15.8278 15.045 17.8373 15.045C20.6469 15.045 23.3263 16.8325 23.3263 20.9493V31.0316H19.7531V21.5541C19.7531 19.7359 18.8268 18.3636 16.7522 18.3636C14.8057 18.3636 13.5292 19.8947 13.5292 21.8086V31.0297H9.89282V21.5541C9.89282 19.7684 8.99522 18.3732 6.88995 18.3732C4.91292 18.3732 3.66699 19.8412 3.66699 21.8182V31.0392Z" fill="currentColor"/>
      <path d="M27.8546 31.0316V7.92917H31.5579V31.0316Z" fill="currentColor"/>
      <path d="M30.0708 39.4871C30.9033 39.7187 31.6517 39.8699 33.2402 39.8699C36.1933 39.8699 39.6765 38.2048 40.5933 33.5311L44.3789 14.7923H50.0076L50.6947 11.6746H45.0086L45.7741 7.95023C46.3598 5.05837 47.9598 3.59234 50.5282 3.59234C51.1962 3.59234 51.0086 3.64975 51.6038 3.76267L52.4268 0.570327C51.6344 0.333006 50.9244 0.191379 49.378 0.191379C47.7454 0.166831 46.1514 0.688934 44.8497 1.67463C43.4086 2.78851 42.4574 4.42487 42.023 6.53779L40.9569 11.6746H35.9234L35.5119 14.7943H40.3349L36.8593 32.1206C36.4765 34.0861 35.3588 36.4364 32.1512 36.4364C31.4239 36.4364 31.688 36.3809 31.0297 36.2737Z" fill="#0194E2"/>
      <path d="M53.3416 30.9053H49.6402L54.7139 7.59616H58.4153Z" fill="#0194E2"/>
      <path d="M71.8067 16.4766C68.5762 14.2161 64.1778 14.6606 61.4649 17.5216C58.7519 20.3826 58.5416 24.7984 60.9703 27.9043L63.3952 26.1244C62.1915 24.6312 61.9471 22.5815 62.7658 20.8471C63.5845 19.1127 65.3224 17.9987 67.2402 17.979V19.8737Z" fill="#43C9ED"/>
      <path d="M62.6179 29.4717C65.8484 31.7322 70.2468 31.2877 72.9597 28.4267C75.6727 25.5657 75.883 21.1499 73.4543 18.044L71.0294 19.8239C72.2331 21.3171 72.4775 23.3668 71.6588 25.1012C70.8401 26.8356 69.1022 27.9496 67.1844 27.9693V26.0746Z" fill="#0194E2"/>
      <path d="M78.0919 15.4928H82.1359L82.9588 26.1053L88.7177 15.4928L92.5569 15.5483L94.0651 26.1053L99.1387 15.4928L102.84 15.5483L95.1617 31.0412H91.4603L89.6765 19.9349L83.7818 31.0412H79.9426Z" fill="#0194E2"/>
      <path d="M105.072 15.7684H104.306V15.5024H106.151V15.7741H105.386V18.0172H105.072Z" fill="#0194E2"/>
      <path d="M106.614 15.5024H106.997L107.479 16.8421C107.541 17.0143 107.598 17.1904 107.657 17.3665H107.675C107.734 17.1904 107.788 17.0143 107.847 16.8421L108.325 15.5024H108.708V18.0172H108.41V16.6297C108.41 16.4096 108.434 16.1072 108.45 15.8832H108.434L108.243 16.4574L107.768 17.7608H107.56L107.079 16.4593L106.888 15.8852H106.873C106.89 16.1091 106.915 16.4115 106.915 16.6316V18.0191H106.624Z" fill="#0194E2"/>
    </svg>
  </div>

  <div class="card">
    <h1>Sign in</h1>
    <p class="sub">Use your MLflow account to continue.</p>

    <div class="alert" id="err" role="alert" aria-live="assertive">
      <svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8 1a7 7 0 1 0 0 14A7 7 0 0 0 8 1Zm-.75 3.5h1.5v4.75h-1.5V4.5ZM8 12.25a1 1 0 1 1 0-2 1 1 0 0 1 0 2Z"/></svg>
      <span id="errText"></span>
    </div>

    <form id="f" novalidate>
      <div class="field">
        <label for="u">Username</label>
        <input id="u" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus>
      </div>
      <div class="field">
        <label for="p">Password</label>
        <div class="control">
          <input id="p" name="password" type="password" autocomplete="current-password" required>
          <button type="button" class="toggle" id="toggle" aria-label="Show password" aria-pressed="false">
            <svg class="show" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg class="hide" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.6 5.1A10.4 10.4 0 0 1 12 5c6.4 0 10 7 10 7a17.6 17.6 0 0 1-2.6 3.5M6.6 6.6C3.7 8.5 2 12 2 12s3.6 7 10 7a9.7 9.7 0 0 0 5.4-1.6M3 3l18 18M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>
          </button>
        </div>
      </div>
      <button class="submit" id="submit" type="submit"><span class="spinner" aria-hidden="true"></span><span id="submitText">Sign in</span></button>
    </form>
  </div>

  <footer>Need an account? Ask your MLflow administrator. · <a href="https://mlflow.org/docs/latest/" target="_blank" rel="noopener">Docs</a></footer>
</main>

<script>
const form = document.getElementById('f');
const user = document.getElementById('u');
const pass = document.getElementById('p');
const toggle = document.getElementById('toggle');
const submit = document.getElementById('submit');
const submitText = document.getElementById('submitText');
const err = document.getElementById('err');
const errText = document.getElementById('errText');

toggle.onclick = () => {
  const show = pass.type === 'password';
  pass.type = show ? 'text' : 'password';
  toggle.setAttribute('aria-pressed', show);
  toggle.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
  pass.focus();
};

function fail(msg, field) {
  errText.textContent = msg;
  err.classList.add('on');
  [user, pass].forEach(i => i.setAttribute('aria-invalid', String(i === field || field === 'both')));
  (field === 'both' ? pass : field || user).focus();
}

function busy(on) {
  submit.disabled = on;
  submitText.textContent = on ? 'Signing in…' : 'Sign in';
}

// btoa() throws on non-Latin-1 characters, so encode as UTF-8 first
const basic = (u, p) => btoa(String.fromCharCode(...new TextEncoder().encode(u + ':' + p)));

form.onsubmit = async e => {
  e.preventDefault();
  err.classList.remove('on');
  if (!user.value.trim()) return fail('Enter your username.', user);
  if (!pass.value) return fail('Enter your password.', pass);

  busy(true);
  const tok = basic(user.value.trim(), pass.value);
  try {
    const r = await fetch('/ajax-api/2.0/mlflow/users/current', { headers: { Authorization: 'Basic ' + tok } });
    if (r.status === 401) { pass.value = ''; return fail('Incorrect username or password.', 'both'); }
    if (!r.ok) return fail('The server returned an error (' + r.status + '). Try again shortly.');
  } catch {
    return fail('Can’t reach the server. Check your connection and try again.');
  } finally {
    busy(false);
  }
  // ponytail: JS-set cookie (not HttpOnly); move to a server-side session if XSS exposure matters
  document.cookie = 'auth=' + tok + '; path=/; SameSite=Strict; max-age=86400';
  busy(true);
  location.reload();
};
</script>
</body>
</html>
