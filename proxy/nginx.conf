# Cookie `auth` (base64 user:pass, set by login.html) wins; API clients without it use their own Authorization header.
map $cookie_auth $upstream_auth {
    ""      $http_authorization;
    default "Basic $cookie_auth";
}
# Browser page loads without the cookie get the login page, even if the browser cached Basic creds (makes /logout work)
map "$cookie_auth|$http_accept" $show_login {
    default 0;
    "~^\|.*text/html" 1;
}
server {
    listen 5000;
    client_max_body_size 0;
    root /usr/share/nginx/html;

    location = /login.html { }
    location = /logout-hook.js { }

    location = /logout {
        add_header Set-Cookie "auth=; path=/; max-age=0";
        return 302 /;
    }

    location / {
        if ($show_login) { rewrite ^ /login.html last; }
        proxy_pass http://mlflow-server:5000;
        proxy_set_header Host $http_host;
        proxy_set_header Authorization $upstream_auth;
        proxy_hide_header WWW-Authenticate;   # suppress the browser's native dialog
        # Inject the hook that makes MLflow's own Logout button clear our cookie
        proxy_set_header Accept-Encoding "";
        sub_filter '</head>' '<script src="/logout-hook.js"></script></head>';
        sub_filter_once on;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
    }
}
